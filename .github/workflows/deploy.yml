name: CI/CD Pipeline

# Trigger: runs every time you push to main branch
on:
  push:
    branches:
      - main

jobs:

  # ─── JOB 1: TEST ───────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v || echo "No tests found, skipping"

  # ─── JOB 2: BUILD & PUSH DOCKER IMAGE ─────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

 # ─── JOB 3: DEPLOY WITH ROLLBACK ──────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Save current running image as backup
            CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' cicd-app 2>/dev/null || echo "none")
            echo "Current image: $CURRENT_IMAGE"

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

            # Stop and remove old container
            docker stop cicd-app || true
            docker rm cicd-app || true

            # Run new container
            docker run -d \
              --name cicd-app \
              --restart always \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

            # Wait for app to start
            sleep 5

            # Health check — if it fails, rollback!
            if curl -f http://localhost:5000/health; then
              echo "✅ Health check passed — deployment successful!"
            else
              echo "❌ Health check failed — rolling back!"
              docker stop cicd-app || true
              docker rm cicd-app || true
              docker run -d \
                --name cicd-app \
                --restart always \
                -p 5000:5000 \
                $CURRENT_IMAGE
              echo "🔄 Rollback complete — previous version restored"
              exit 1
            fi