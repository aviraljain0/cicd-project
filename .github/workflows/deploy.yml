name: CI/CD Pipeline

# Trigger: runs every time you push to main branch
on:
  push:
    branches:
      - main

jobs:

  # ─── JOB 1: TEST ───────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v || echo "No tests found, skipping"

  # ─── JOB 2: BUILD & PUSH DOCKER IMAGE ─────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

  # ─── JOB 3: DEPLOY TO EC2 ──────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

            # Stop and remove old container if running
            docker stop cicd-app || true
            docker rm cicd-app || true

            # Run new container
            docker run -d \
              --name cicd-app \
              --restart always \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

            # Health check
            sleep 5
            curl -f http://localhost:5000/health || exit 1

            echo "Deployment successful!"